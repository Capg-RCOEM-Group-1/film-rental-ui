<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: white; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .bg-netflix { background-color: #E50914; }
        .text-netflix { color: #E50914; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen fade-in flex justify-center items-start pt-10 sm:pt-16">

    <div class="max-w-2xl w-full bg-black shadow-2xl rounded-xl border border-gray-800 overflow-hidden mx-4">
        
        <!-- Header -->
        <div class="bg-gray-900 px-6 py-5 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold text-white tracking-wide">Add New Customer</h2>
            <a href="/ekansh/customers" class="text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>

        <!-- Form -->
        <form th:action="@{/ekansh/customers}" th:object="${customerForm}" method="POST" class="p-6 sm:p-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">

                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-2">First Name <span class="text-netflix">*</span></label>
                    <input type="text" th:field="*{firstName}" required 
                           class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-2">Last Name <span class="text-netflix">*</span></label>
                    <input type="text" th:field="*{lastName}" required 
                           class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none transition">
                </div>

                <div class="sm:col-span-2">
                    <label class="block text-sm font-bold text-gray-400 mb-2">Email Address</label>
                    <input type="email" th:field="*{email}" 
                           class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-2">Assigned Store <span class="text-netflix">*</span></label>
                    <select th:field="*{storeId}" required 
                            class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none transition">
                        <option value="" disabled selected>Select a store...</option>
                        <option th:each="store : ${stores}" th:value="${store.storeId}" th:text="${store.fullDisplay}"></option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-400 mb-2">Customer Address <span class="text-netflix">*</span></label>
                    <select th:field="*{addressId}" required 
                            class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none transition">
                        <option value="" disabled selected>Select an address...</option>
                        <option th:each="address : ${addresses}" th:value="${address.addressId}" th:text="${address.fullDisplay}"></option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end gap-4 pt-6 border-t border-gray-800 mt-4">
                <a href="/ekansh/customers" class="px-5 py-2.5 border border-gray-700 text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-800 transition">Cancel</a>
                <button type="submit" class="px-5 py-2.5 bg-netflix text-white rounded-lg text-sm font-bold hover:bg-red-700 transition shadow-lg w-full sm:w-auto">Save Customer</button>
            </div>
        </form>

    </div>
</body>
</html>
