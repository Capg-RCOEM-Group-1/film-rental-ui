<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Summary - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        body { background-color: #141414; color: white; }
        .bg-netflix { background-color: #E50914; }
        .hover-bg-netflix:hover { background-color: #f40612; }
        .text-netflix { color: #E50914; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #b3b3b3; }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>

<body class="font-sans antialiased min-h-screen fade-in flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
        <div class="flex items-center gap-8">
            <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
            <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
                <a href="/" class="text-white nav-link">Home</a>
                <a href="/films" class="text-gray-300 nav-link">Films</a>
                <a href="/categories" class="text-gray-300 nav-link">Categories</a>
                <a href="/ekansh/customers" class="text-gray-300 nav-link">Customers</a>
                <a href="/aditya/staff" class="text-gray-300 nav-link">Staff</a>
                <a href="/mandar/languages" class="text-gray-300 nav-link">Languages</a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 sm:p-8 flex-grow w-full">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
                Payments processed by <span th:text="${staffName}" class="text-netflix">Staff Name</span>
            </h2>
            
            <a th:href="@{/aditya/staff}" class="px-4 py-2 border border-gray-700 bg-gray-900 text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-800 transition flex items-center justify-center gap-2">
                &larr; Back to Staff List
            </a>
        </div>

        <!-- Table Card -->
        <div class="bg-black shadow-lg rounded-xl border border-gray-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-800">

                    <thead class="bg-gray-900 text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-4 text-left">Customer</th>
                        <th class="px-6 py-4 text-left">Amount</th>
                        <th class="px-6 py-4 text-left">Date</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-gray-800 bg-black">

                    <tr th:each="payment : ${payments}" class="hover:bg-gray-900 transition duration-200 group text-sm">
                        <td class="px-6 py-4 font-bold text-white tracking-wider" th:text="${payment.customerName}">Customer Name</td>
                        <td class="px-6 py-4 text-green-500 font-medium" th:text="${'$' + #numbers.formatDecimal(payment.amount, 1, 2)}">$0.00</td>
                        <td class="px-6 py-4 text-gray-400" th:text="${#temporals.format(payment.paymentDate, 'dd-MM-yyyy HH:mm')}">Date</td>
                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(payments)}">
                        <td colspan="3" class="px-6 py-12 text-center text-gray-500">
                            No payment records found for this staff member.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-6 flex justify-center" th:if="${page != null and page.totalPages > 1}">
            <nav class="flex gap-2 items-center">
                
                <a th:if="${page.number > 0}"
                   th:href="@{/adtiya/staff/payments(username=${username}, staffName=${staffName}, page=${page.number - 1})}"
                   class="px-3 py-1 border border-gray-700 rounded text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    &larr; Prev
                </a>
                
                <span class="px-3 py-1 text-sm font-bold text-white bg-gray-800 rounded border border-gray-700">
                    Page <span th:text="${page.number + 1}"></span> of <span th:text="${page.totalPages}"></span>
                </span>

                <a th:if="${page.number + 1 < page.totalPages}"
                   th:href="@{/aditya/staff/payments(username=${username}, staffName=${staffName}, page=${page.number + 1})}"
                   class="px-3 py-1 border border-gray-700 rounded text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    Next &rarr;
                </a>

            </nav>
        </div>

    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-600 border-t border-gray-900 mt-auto bg-black">
        <p class="text-xs">&copy; 2026 FilmFlix Management System.</p>
    </footer>

</body>
</html>
