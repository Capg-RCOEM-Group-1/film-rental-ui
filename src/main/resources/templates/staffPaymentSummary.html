<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payment Summary</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Payments processed by <span th:text="${staffName}" class="text-primary">Staff Name</span></h2>
    <a th:href="@{/aditya/staff}" class="btn btn-outline-secondary">Back to Staff List</a>
</div>

<table class="table table-bordered table-striped">
    <thead class="table-light">
    <tr>
        <th>Customer</th>
        <th>Amount</th>
        <th>Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="payment : ${payments}">
        <td th:text="${payment.customerName}">Customer Name</td>
        <td th:text="${'$' + #numbers.formatDecimal(payment.amount, 1, 2)}">$0.00</td>
        <td th:text="${#temporals.format(payment.paymentDate, 'dd-MM-yyyy HH:mm')}">Date</td>
    </tr>
    <tr th:if="${#lists.isEmpty(payments)}">
        <td colspan="3" class="text-center text-muted">No payment records found for this staff member.</td>
    </tr>
    </tbody>
</table>

<nav th:if="${page != null and page.totalPages > 1}">
    <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${page.number == 0} ? 'disabled'">
            <a class="page-link"
               th:href="@{/adtiya/staff/payments(username=${username}, staffName=${staffName}, page=${page.number - 1})}">
                Previous
            </a>
        </li>

        <li class="page-item disabled">
                <span class="page-link">
                    Page <span th:text="${page.number + 1}"></span> of <span th:text="${page.totalPages}"></span>
                </span>
        </li>

        <li class="page-item" th:classappend="${page.number + 1 >= page.totalPages} ? 'disabled'">
            <a class="page-link"
               th:href="@{/aditya/staff/payments(username=${username}, staffName=${staffName}, page=${page.number + 1})}">
                Next
            </a>
        </li>
    </ul>
</nav>

</body>
</html>
