<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${film.filmId != null ? 'Edit Film' : 'Add New Film'}"></title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-6 sm:p-12 font-sans antialiased min-h-screen">

    <div class="max-w-4xl mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="bg-gray-900 p-8">
            <h2 class="text-2xl font-bold text-white" th:text="${film.filmId != null ? 'Update Film Record' : 'Create New Film Record'}"></h2>
            <p class="text-gray-400 text-sm mt-1 italic">Please ensure all required movie information is provided.</p>
        </div>

        <!-- Form: Note the th:action use for path independence -->
        <form th:action="@{/films/save}" th:object="${film}" method="POST" class="p-8 space-y-6">
            
            <!-- Hidden ID Field (Only used during Edit) -->
            <input type="hidden" th:field="*{filmId}" />

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                
                <!-- 1. Title -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Movie Title</label>
                    <input type="text" th:field="*{title}" placeholder="ENTER MOVIE TITLE" required
                        class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:bg-white uppercase outline-none transition" />
                </div>

                <!-- 2. Description -->
                <div class="md:col-span-2">
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Synopsis (Description)</label>
                    <textarea th:field="*{description}" rows="3" placeholder="Enter movie description..."
                        class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none transition"></textarea>
                </div>

                <!-- 3. Language (Using your Service results) -->
                <!-- Inside filmform.html, locate the Language Select section -->
<div>
    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Primary Language</label>
    <select name="languageId" required
        class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 outline-none transition">
        
        <option value="" disabled th:selected="${film.filmId == null}">-- Select Language --</option>
        
        <!-- Use lang.id (String) for the value and lang.name for display -->
        <option th:each="lang : ${languages}" 
                th:value="${lang.id}" 
                th:text="${lang.name}"
                th:selected="${lang.name == film.language}">
        </option>
        
    </select>
</div>

                <!-- 4. Rating -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">MPAA Rating</label>
                    <select th:field="*{rating}" required
                        class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none">
                        <option value="G">General Audiences (G)</option>
                        <option value="PG">Parental Guidance Suggested (PG)</option>
                        <option value="PG-13">Parents Strongly Cautioned (PG-13)</option>
                        <option value="R">Restricted (R)</option>
                        <option value="NC-17">Adults Only (NC-17)</option>
                    </select>
                </div>

                <!-- 5. Numeric Fields: Year & Duration -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Release Year</label>
                        <input type="number" th:field="*{releaseYear}" min="1900" max="2100"
                            class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 outline-none" />
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Length (Mins)</label>
                        <input type="number" th:field="*{length}"
                            class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 outline-none" />
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">Rental Period</label>
                        <input type="number" th:field="*{rentalDuration}" placeholder="Days"
                            class="w-full border border-gray-200 rounded-lg p-3 bg-gray-50 outline-none" />
                    </div>
                    <div class="invisible">Spacer</div>
                </div>

                <!-- 6. Pricing Fields -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 text-green-600">Rental Rate ($)</label>
                    <input type="number" step="0.01" th:field="*{rentalRate}" required
                        class="w-full border border-green-200 rounded-lg p-3 bg-green-50 focus:bg-white outline-none text-green-700 font-bold" />
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 text-red-500">Replacement Cost ($)</label>
                    <input type="number" step="0.01" th:field="*{replacementCost}" required
                        class="w-full border border-red-100 rounded-lg p-3 bg-red-50 focus:bg-white outline-none text-red-600 font-bold" />
                </div>

                <!-- 7. Special Features (Checkboxes) -->
                <!-- Locate the Special Features section in filmform.html -->
<div class="flex flex-wrap gap-4 p-4 border border-dashed border-gray-300 rounded-xl">
    <!-- Value should ideally match backend Set enum name: BEHIND_THE_SCENES, DELETED_SCENES, etc. -->
    <label class="flex items-center gap-2 px-3 py-1 bg-white border border-gray-200 rounded-full cursor-pointer hover:bg-blue-50 transition">
        <input type="checkbox" name="specialFeatures" value="TRAILERS" 
               th:checked="${film.specialFeatures != null and film.specialFeatures.contains('TRAILERS')}" />
        <span class="text-xs font-semibold text-gray-700">Trailers</span>
    </label>
    
    <label class="flex items-center gap-2 px-3 py-1 bg-white border border-gray-200 rounded-full cursor-pointer hover:bg-blue-50 transition">
        <input type="checkbox" name="specialFeatures" value="COMMENTARIES" 
               th:checked="${film.specialFeatures != null and film.specialFeatures.contains('COMMENTARIES')}" />
        <span class="text-xs font-semibold text-gray-700">Commentaries</span>
    </label>
    
    <label class="flex items-center gap-2 px-3 py-1 bg-white border border-gray-200 rounded-full cursor-pointer hover:bg-blue-50 transition">
        <input type="checkbox" name="specialFeatures" value="DELETED_SCENES" 
               th:checked="${film.specialFeatures != null and film.specialFeatures.contains('DELETED_SCENES')}" />
        <span class="text-xs font-semibold text-gray-700">Deleted Scenes</span>
    </label>
    
    <label class="flex items-center gap-2 px-3 py-1 bg-white border border-gray-200 rounded-full cursor-pointer hover:bg-blue-50 transition">
        <input type="checkbox" name="specialFeatures" value="BEHIND_THE_SCENES" 
               th:checked="${film.specialFeatures != null and film.specialFeatures.contains('BEHIND_THE_SCENES')}" />
        <span class="text-xs font-semibold text-gray-700">Behind the Scenes</span>
    </label>
</div>

            <!-- Footer Buttons -->
            <div class="flex items-center justify-between mt-10 pt-6 border-t border-gray-100">
                <a th:href="@{/films}" class="text-sm font-medium text-gray-400 hover:text-red-500 transition underline underline-offset-4">
                    &larr; Cancel and go back
                </a>
                <button type="submit"
                    class="px-10 py-3 bg-blue-600 text-white rounded-lg text-sm font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 hover:shadow-none transition transform hover:-translate-y-0.5 active:translate-y-0">
                    <span th:text="${film.filmId != null ? 'SAVE CHANGES' : 'CREATE FILM'}"></span>
                </button>
            </div>
        </form>
    </div>

</body>
</html>
