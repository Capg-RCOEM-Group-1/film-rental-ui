<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Inventory | FilmRental</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-900 min-h-screen text-slate-300 p-6 md:p-12">
<div class="max-w-7xl mx-auto">
  <header class="mb-12">
    <a href="/stores" class="text-blue-400 hover:text-blue-300 flex items-center gap-2 mb-6 transition">
      ← Back to Network
    </a>
    <h1 class="text-5xl font-black text-white italic tracking-tighter">STORE <span class="text-blue-500">INVENTORY</span></h1>
    <p class="text-slate-500 mt-2">Browsing catalog for Store #<span th:text="${storeId}"></span></p>
  </header>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    <div th:each="film : ${films}" class="group relative bg-slate-800 rounded-3xl p-6 border border-slate-700 hover:border-blue-500 transition-all hover:-translate-y-2 shadow-xl">
      <div class="absolute -top-3 -right-3 bg-blue-600 text-white text-[10px] font-black px-3 py-1 rounded-full shadow-lg" th:text="${film.rating}">PG-13</div>

      <h3 class="text-xl font-bold text-white mb-2 group-hover:text-blue-400 transition" th:text="${film.title}">Film Title</h3>
      <p class="text-sm text-slate-400 line-clamp-4 leading-relaxed" th:text="${film.description}">Description</p>

      <div class="mt-6 pt-6 border-t border-slate-700 flex justify-between items-center">
        <span class="text-2xl font-black text-white" th:text="'$' + ${film.rentalRate}">$0.00</span>
        <button class="bg-slate-700 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-white hover:text-slate-900 transition">
          Details
        </button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
