<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Form - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: white; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .bg-netflix { background-color: #E50914; }
        .text-netflix { color: #E50914; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen fade-in flex justify-center items-start pt-10 sm:pt-20">

    <div class="max-w-xl w-full bg-black shadow-2xl rounded-xl border border-gray-800 overflow-hidden mx-4">
        
        <!-- Header -->
        <div class="bg-gray-900 px-6 py-5 border-b border-gray-800 flex justify-between items-center">
            <h2 class="text-xl font-bold text-white tracking-wide">Category Form</h2>
            <a href="/categories" class="text-gray-400 hover:text-white transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>

        <!-- Form -->
        <form th:action="@{/categories/save}" method="post" th:object="${category}" class="p-6 sm:p-8">
            <input type="hidden" th:field="*{categoryId}"/>

            <div class="mb-8">
                <label class="block text-sm font-bold text-gray-400 mb-2">Category Name <span class="text-netflix">*</span></label>
                <input type="text" th:field="*{name}" required 
                       class="w-full px-4 py-3 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none transition placeholder-gray-500" 
                       placeholder="e.g. Action, Comedy">
            </div>

            <div class="flex justify-end gap-4 pt-6 border-t border-gray-800 mt-4">
                <a href="/categories" class="px-5 py-2.5 border border-gray-700 text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-800 transition">Cancel</a>
                <button type="submit" class="px-5 py-2.5 bg-netflix text-white rounded-lg text-sm font-bold hover:bg-red-700 transition shadow-lg w-full sm:w-auto">Save Category</button>
            </div>
        </form>

    </div>

</body>
</html>
