<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Category Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --cancel-gradient: linear-gradient(135deg, #bdc3c7 0%, #2c3e50 100%);
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .form-container {
            width: 100%;
            max-width: 500px;
        }

        .form-card {
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.4);
            box-shadow: 0 25px 50px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .form-header {
            background: var(--primary-gradient);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .form-header-icon {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2rem;
        }

        .form-header h3 {
            font-weight: 700;
            font-size: 1.8rem;
            margin: 0;
        }

        .form-header p {
            opacity: 0.9;
            margin: 10px 0 0;
            font-weight: 300;
        }

        .form-body {
            padding: 40px;
        }

        .input-group {
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 12px;
            font-size: 0.95rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
            font-size: 1.1rem;
        }

        .custom-input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            background: #f8fafc;
        }

        .custom-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .custom-input::placeholder {
            color: #a0aec0;
        }

        .form-footer {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-form {
            flex: 1;
            padding: 16px 30px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }

        .btn-save {
            background: var(--success-gradient);
            color: white;
        }

        .btn-save:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(17, 153, 142, 0.4);
        }

        .btn-cancel {
            background: #f1f5f9;
            color: #64748b;
        }

        .btn-cancel:hover {
            background: #e2e8f0;
            color: #475569;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<div class="form-container">
    <div class="form-card">

        <div class="form-header">
            <div class="form-header-icon">
                <i class="fas fa-folder-plus"></i>
            </div>
            <h3>Category Form</h3>
            <p>Create or edit category</p>
        </div>

        <div class="form-body">
            <form th:action="@{/categories/save}" method="post" th:object="${category}">

                <input type="hidden" th:field="*{categoryId}"/>

                <div class="input-group">
                    <label class="input-label">Category Name</label>
                    <div class="input-wrapper">
                        <i class="fas fa-tag input-icon"></i>
                        <input type="text" th:field="*{name}" class="custom-input" placeholder="Enter category name..." required>
                    </div>
                </div>

                <div class="form-footer">
                    <button type="submit" class="btn-form btn-save">
                        <i class="fas fa-check"></i> Save Category
                    </button>
                    <a href="/categories" class="btn-form btn-cancel">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </div>

            </form>
        </div>

    </div>
</div>

</body>
</html>
