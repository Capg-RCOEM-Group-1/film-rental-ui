<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Films</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ✅ Added border styles */
        table {
            border-collapse: collapse;
            width: 100%;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        th {
            background-color: #f3f4f6;
            font-weight: 600;
        }

        th, td {
            padding: 12px;
            text-align: left;
        }

        tr:hover {
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="bg-gray-100 p-8">


<h1>Films List</h1>


<a th:href="@{/films/new}">Add Film</a>


<br><br>


<table border="1" cellpadding="10">
    <thead>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Year</th>
            <th>Length</th>
            <th>Rating</th>
            <th>Language</th>
            <th>Rental Rate</th>        <!-- Header 7 -->
            <th>Replacement Cost</th>  <!-- Header 8 -->
            <th>Special Features</th>   <!-- Header 9 -->
            <th>Actions</th>           <!-- Header 10 -->
        </tr>
    </thead>

    <tbody>
        <tr th:each="film : ${films}">
            <td th:text="${film.title}"></td>
            <td th:text="${film.description}"></td>
            <td th:text="${film.releaseYear}"></td>
            <td th:text="${film.length}"></td>
            <td th:text="${film.rating}"></td>
            <td th:text="${film.language}"></td>
            
            <!-- 7. Rental Rate (Matches Header) -->
            <td th:text="${'$' + film.rentalRate}"></td>
            
            <!-- 8. Replacement Cost (Matches Header) -->
            <td th:text="${'$' + film.replacementCost}"></td>

            <!-- 9. Special Features (MOVED HERE TO MATCH HEADER) -->
            <td class="p-3 text-xs italic">
                <span th:if="${film.specialFeatures != null}"
                      th:text="${#strings.listJoin(film.specialFeatures, ', ')}">
                </span>
                <span th:if="${film.specialFeatures == null}">None</span>
            </td>


        <td>
            <!-- ✅ DELETE -->
            <a th:href="@{/films/delete/{id}(id=${film.idFromLink})}"
               onclick="return confirm('Are you sure you want to delete this film?');">
                Delete
            </a>
        </td>
    </tr>


</table>


</body>
</html>
