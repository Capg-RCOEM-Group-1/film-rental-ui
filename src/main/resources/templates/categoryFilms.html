<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Films in Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <a th:href="@{/categories}" class="btn btn-secondary mb-3">← Back</a>

    <h2 class="mb-4 text-center" th:text="'🎥 Films in ' + ${categoryName}"></h2>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-bordered table-hover align-middle">
                <thead class="table-primary">
                <tr>
                    <th>Title</th>
                    <th>Release Year</th>
                    <th>Rating</th>
                    <th>Rental Rate</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="film : ${films}">
                    <td th:text="${film.title}"></td>
                    <td th:text="${film.releaseYear}"></td>
                    <td th:text="${film.rating}"></td>
                    <td th:text="${film.rentalRate}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(films)}">
                    <td colspan="4" class="text-center text-danger">
                        No films found in this category
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4" th:if="${page != null && page.totalPages > 1}">

        <nav>
            <ul class="pagination">

                <li class="page-item" th:classappend="${page.number == 0} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/categories/films(categoryId=${categoryId}, name=${categoryName}, page=${page.number - 1})}">
                        Previous
                    </a>
                </li>

                <li class="page-item active">
                <span class="page-link"
                      th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
                </li>

                <li class="page-item" th:classappend="${page.number + 1 >= page.totalPages} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/categories/films(categoryId=${categoryId}, name=${categoryName}, page=${page.number + 1})}">
                        Next
                    </a>
                </li>

            </ul>
        </nav>

    </div>

</div>

</body>
</html>
