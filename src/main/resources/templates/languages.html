<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Languages - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        body { background-color: #141414; color: white; }
        .bg-netflix { background-color: #E50914; }
        .hover-bg-netflix:hover { background-color: #f40612; }
        .text-netflix { color: #E50914; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #b3b3b3; }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>

<body class="font-sans antialiased min-h-screen fade-in flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
        <div class="flex items-center gap-8">
            <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
            <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
                <a href="/" class="text-white nav-link">Home</a>
                <a href="/films" class="text-gray-300 nav-link">Films</a>
                <a href="/categories" class="text-gray-300 nav-link">Categories</a>
                <a href="/ekansh/customers" class="text-gray-300 nav-link">Customers</a>
                <a href="/aditya/staff" class="text-gray-300 nav-link">Staff</a>
                <a href="/mandar/languages" class="text-gray-300 nav-link">Languages</a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 sm:p-8 flex-grow w-full">

        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">

            <!-- Title -->
            <h2 class="text-3xl font-extrabold text-white tracking-tight text-netflix">
                Language Directory
            </h2>

            <!-- Right Section -->
            <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">

                <!-- Search Form -->
                <form action="/mandar/languages" method="GET" class="flex gap-2 w-full">

                    <div class="relative w-full sm:w-72">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </div>

                        <input type="text" name="name" th:value="${name}"
                               class="w-full pl-10 pr-3 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white placeholder-gray-400 focus:ring-2 focus:ring-[#E50914] focus:border-transparent text-sm"
                               placeholder="Search language...">
                    </div>

                    <button type="submit"
                            class="px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg text-sm font-medium hover:bg-gray-700 transition">
                        Search
                    </button>
                </form>

                <!-- Add Button -->
                <a th:href="@{/mandar/languages/new}"
                   class="px-4 py-2 bg-white text-black bg-opacity-90 rounded-lg text-sm font-bold hover:bg-gray-200 transition flex items-center justify-center gap-1 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    Add
                </a>

            </div>
        </div>

        <!-- Table -->
        <div class="bg-black shadow-lg rounded-xl border border-gray-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-800">

                    <thead class="bg-gray-900 text-xs font-bold text-gray-400 uppercase tracking-wider">
                    <tr>
                        <th class="px-6 py-4 text-left">Name</th>
                        <th class="px-6 py-4 text-left">Actions</th>
                    </tr>
                    </thead>

                    <tbody class="divide-y divide-gray-800 bg-black">

                    <tr th:each="language : ${languages}" class="hover:bg-gray-900 transition duration-200 group text-sm">
                        <td class="px-6 py-4 font-bold text-white tracking-wider"
                            th:text="${language.name}"></td>

                        <td class="px-6 py-4 flex gap-2">

                            <!-- View -->
                            <a th:href="@{/mandar/language/films(id=${language.id}, name=${language.name})}"
                               class="px-3 py-1 bg-gray-800 text-blue-400 border border-gray-700 rounded text-xs hover:bg-gray-700 transition">
                                View Films
                            </a>

                            <!-- Edit -->
                            <a th:href="@{/mandar/languages/edit/{id}(id=${language.id})}"
                               class="px-3 py-1 bg-gray-800 text-yellow-500 border border-gray-700 rounded text-xs hover:bg-gray-700 transition">
                                Edit
                            </a>

                        </td>
                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${languages == null or languages.isEmpty()}">
                        <td colspan="2" class="px-6 py-8 text-center text-gray-500">
                            No languages found.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4"
             th:if="${pageData != null and pageData.totalPages > 0}">

            <!-- Info -->
            <p class="text-sm text-gray-400 p-2">
                Page
                <span class="font-bold text-white" th:text="${pageData.number + 1}"></span>
                of
                <span class="font-bold text-white" th:text="${pageData.totalPages}"></span>
                |
                Total:
                <span class="font-bold text-white" th:text="${pageData.totalElements}"></span>
            </p>

            <!-- Controls -->
            <div class="flex gap-2">

                <a th:if="${pageData.number > 0}"
                   th:href="@{/mandar/languages(page=${pageData.number - 1}, keyword=${currentKeyword})}"
                   class="px-3 py-1 border border-gray-700 rounded text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    &larr; Prev
                </a>

                <a th:if="${pageData.number < pageData.totalPages - 1}"
                   th:href="@{/mandar/languages(page=${pageData.number + 1}, keyword=${currentKeyword})}"
                   class="px-3 py-1 border border-gray-700 rounded text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    Next &rarr;
                </a>

            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-600 border-t border-gray-900 mt-auto bg-black">
        <p class="text-xs">&copy; 2026 FilmFlix Management System.</p>
    </footer>

</body>
</html>
