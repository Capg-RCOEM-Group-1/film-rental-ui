<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Languages</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

<div class="max-w-6xl mx-auto bg-white shadow-lg rounded-2xl p-6">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">

        <!-- Title -->
        <h2 class="text-2xl font-bold text-gray-800">
            🌐 Language Directory
        </h2>

        <!-- Right Section -->
        <div class="flex flex-col sm:flex-row gap-3 w-full sm:w-auto">

            <!-- Search Form -->
            <form action="/mandar/languages" method="GET" class="flex gap-2 w-full">

                <div class="relative w-full sm:w-72">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                    </div>

                    <input type="text" name="name" th:value="${name}"
                           class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm shadow-sm"
                           placeholder="Search language...">
                </div>

                <button type="submit"
                        class="px-2 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 shadow-sm text-sm">
                    Search
                </button>
            </form>

            <!-- Add Button -->
            <a th:href="@{/mandar/languages/new}"
               class="px-2 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 shadow-sm text-sm text-center">
                + Add
            </a>

        </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto rounded-lg border border-gray-200">
        <table class="min-w-full">

            <thead class="bg-gray-50">
            <tr>
                <th class="text-left px-6 py-3 text-sm font-semibold text-gray-600">Name</th>
                <th class="text-left px-6 py-3 text-sm font-semibold text-gray-600">Actions</th>
            </tr>
            </thead>

            <tbody class="divide-y divide-gray-200 bg-white">

            <tr th:each="language : ${languages}" class="hover:bg-gray-50 transition">
                <td class="px-6 py-4 text-gray-800 font-medium"
                    th:text="${language.name}"></td>

                <td class="px-6 py-4 flex gap-2">

                    <!-- View -->
                    <a th:href="@{/mandar/language/films(id=${language.id}, name=${language.name})}"
                       class="px-3 py-1 bg-blue-100 text-blue-700 rounded-md hover:bg-blue-200 text-sm font-medium">
                        View
                    </a>

                    <!-- Edit -->
                    <a th:href="@{/mandar/languages/edit/{id}(id=${language.id})}"
                       class="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-md hover:bg-yellow-200 text-sm font-medium">
                        Edit
                    </a>

                </td>
            </tr>

            <!-- Empty State -->
            <tr th:if="${languages == null or languages.isEmpty()}">
                <td colspan="2" class="text-center py-8 text-gray-500">
                    No languages found.
                </td>
            </tr>

            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4"
         th:if="${pageData != null and pageData.totalPages > 0}">

        <!-- Info -->
        <p class="text-sm text-gray-600">
            Page
            <span class="font-semibold text-gray-800" th:text="${pageData.number + 1}"></span>
            of
            <span class="font-semibold text-gray-800" th:text="${pageData.totalPages}"></span>
            |
            Total:
            <span class="font-semibold text-gray-800" th:text="${pageData.totalElements}"></span>
        </p>

        <!-- Controls -->
        <div class="flex gap-2">

            <a th:if="${pageData.number > 0}"
               th:href="@{/mandar/languages(page=${pageData.number - 1}, keyword=${currentKeyword})}"
               class="px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-100 text-sm shadow-sm">
                ⬅ Previous
            </a>

            <a th:if="${pageData.number < pageData.totalPages - 1}"
               th:href="@{/mandar/languages(page=${pageData.number + 1}, keyword=${currentKeyword})}"
               class="px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-700 hover:bg-gray-100 text-sm shadow-sm">
                Next ➡
            </a>

        </div>
    </div>

</div>

</body>
</html>
