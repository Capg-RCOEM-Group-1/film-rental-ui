<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Customer Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen p-4 sm:p-8 fade-in">

    <div class="max-w-7xl mx-auto">

        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900 tracking-tight">Customer Directory</h2>
            <p class="text-gray-500 mt-2 text-sm">Search and manage your customers to view their rental history.</p>
        </div>

        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
            <form action="/ekansh/customers" method="GET" class="flex w-full sm:w-auto gap-3">
                <div class="relative w-full sm:w-80">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                    </div>
                    <input type="text" name="keyword" th:value="${currentKeyword}"
                        class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg leading-5 bg-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition duration-150 ease-in-out shadow-sm"
                        placeholder="Search name, email, or address...">
                </div>

                <button type="submit"
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
                    Search
                </button>

                <a href="/ekansh/customers/new"
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 flex-shrink-0">
                    + Add Customer
                </a>

                <button type="button" id="toggleUpdateBtn"
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-gray-800 bg-yellow-400 hover:bg-yellow-500 transition duration-150 flex-shrink-0">
                    Update Customer
                </button>
                <button type="submit" id="submitUpdateBtn" form="updateForm"
                    class="hidden inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 transition duration-150 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled>
                    Edit Selected
                </button>

                <button type="button" id="toggleDeleteBtn"
                    class="inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 transition duration-150 flex-shrink-0">
                    Delete Customer
                </button>
                <button type="submit" id="submitDeleteBtn" form="updateForm" formaction="/ekansh/customers/delete"
                    formmethod="POST"
                    class="hidden inline-flex items-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-red-800 hover:bg-red-900 transition duration-150 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed"
                    disabled onclick="return confirm('Are you sure you want to delete the selected customer(s)?');">
                    Delete Selected
                </button>

                <a th:if="${currentKeyword != null and !currentKeyword.isEmpty()}" href="/ekansh/customers"
                    class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150">
                    Clear
                </a>
            </form>
        </div>

        <div th:if="${error}" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded-r-lg shadow-sm fade-in">
            <div class="flex">
                <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd"
                            d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                            clip-rule="evenodd" />
                    </svg>
                </div>
                <div class="ml-3">
                    <p class="text-sm text-red-700 font-medium" th:text="${error}"></p>
                </div>
            </div>
        </div>

        <div th:if="${successMessage}" class="bg-green-50 border-l-4 border-green-500 p-4 mb-6 rounded-r-lg">
            <p class="text-sm text-green-700 font-medium" th:text="${successMessage}"></p>
        </div>

        <form id="updateForm" action="/ekansh/customers/edit" method="GET">
            <div class="bg-white shadow-md rounded-xl border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col"
                                    class="radio-col hidden px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-12">
                                    Select</th>
                                <th scope="col"
                                    class="checkbox-col hidden px-6 py-4 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-12">
                                    <input type="checkbox" id="selectAllCb"
                                        class="w-4 h-4 text-red-600 bg-gray-100 border-gray-300 rounded focus:ring-red-500 cursor-pointer">
                                </th>
                                <th scope="col"
                                    class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-16">
                                    Sr No</th>
                                <th scope="col"
                                    class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    Name</th>
                                <th scope="col"
                                    class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    Email</th>
                                <th scope="col"
                                    class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                    Address</th>
                                <th scope="col"
                                    class="px-6 py-4 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider w-32">
                                    Action</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-100">

                            <tr th:each="customer, stat : ${customers}"
                                class="hover:bg-blue-50 transition duration-150 ease-in-out group">
                                <td class="radio-col hidden px-6 py-4 whitespace-nowrap text-center">
                                    <input type="radio" name="customerId" th:value="${customer.customerId}"
                                        class="customer-radio w-4 h-4 text-blue-600 bg-gray-100 border-gray-300 focus:ring-blue-500 cursor-pointer">
                                </td>
                                <td class="checkbox-col hidden px-6 py-4 whitespace-nowrap text-center">
                                    <input type="checkbox" name="customerIds" th:value="${customer.customerId}"
                                        class="customer-checkbox w-4 h-4 text-red-600 bg-gray-100 border-gray-300 rounded focus:ring-red-500 cursor-pointer">
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-semibold text-gray-400"
                                        th:text="${(pageData != null ? pageData.number * pageData.size : 0) + stat.count}">
                                    </div>
                                </td>

                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm font-medium text-gray-900" th:text="${customer.name}"></div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap">
                                    <div class="text-sm text-gray-600" th:text="${customer.email}"></div>
                                </td>
                                <td class="px-6 py-4">
                                    <div class="text-sm text-gray-600 line-clamp-2" th:text="${customer.fullAddress}">
                                    </div>
                                </td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                                    <a th:href="@{/ekansh/rentals(customerId=${customer.customerId}, name=${customer.name})}"
                                        class="inline-flex items-center text-blue-600 hover:text-blue-800 transition">
                                        Rentals
                                        <svg class="ml-1 w-4 h-4 opacity-0 group-hover:opacity-100 group-hover:translate-x-1 transition-all"
                                            fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M9 5l7 7-7 7"></path>
                                        </svg>
                                    </a>
                                </td>
                            </tr>

                            <tr th:if="${customers == null or customers.isEmpty()}">
                                <td colspan="7" class="px-6 py-12 text-center">
                                    <svg class="mx-auto h-12 w-12 text-gray-300" fill="none" viewBox="0 0 24 24"
                                        stroke="currentColor" aria-hidden="true">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
                                            d="M12 4v16m8-8H4"></path>
                                    </svg>
                                    <h3 class="mt-2 text-sm font-medium text-gray-900">No customers found</h3>
                                    <p class="mt-1 text-sm text-gray-500">Try adjusting your search criteria.</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </form>

        <div class="mt-6 flex items-center justify-between" th:if="${pageData != null and pageData.totalPages > 0}">
            <div
                class="hidden sm:flex-1 sm:flex sm:items-center sm:justify-between bg-white p-4 rounded-xl border border-gray-200 shadow-sm">

                <div>
                    <p class="text-sm text-gray-700">
                        Showing page <span class="font-semibold text-gray-900" th:text="${pageData.number + 1}"></span>
                        of
                        <span class="font-semibold text-gray-900" th:text="${pageData.totalPages}"></span>
                        <span class="text-gray-400 mx-1">|</span>
                        Total: <span class="font-semibold text-gray-900" th:text="${pageData.totalElements}"></span>
                        customers
                    </p>
                </div>

                <div class="flex gap-2">
                    <a th:if="${pageData.number > 0}"
                        th:href="@{/ekansh/customers(page=${pageData.number - 1}, keyword=${currentKeyword})}"
                        class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition shadow-sm">
                        Previous
                    </a>

                    <a th:if="${pageData.number < pageData.totalPages - 1}"
                        th:href="@{/ekansh/customers(page=${pageData.number + 1}, keyword=${currentKeyword})}"
                        class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 transition shadow-sm">
                        Next
                    </a>
                </div>
            </div>

            <div class="flex items-center justify-between w-full sm:hidden">
                <a th:if="${pageData.number > 0}"
                    th:href="@{/ekansh/customers(page=${pageData.number - 1}, keyword=${currentKeyword})}"
                    class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    Previous
                </a>
                <p class="text-sm text-gray-700">Pg <span th:text="${pageData.number + 1}"></span></p>
                <a th:if="${pageData.number < pageData.totalPages - 1}"
                    th:href="@{/ekansh/customers(page=${pageData.number + 1}, keyword=${currentKeyword})}"
                    class="relative inline-flex items-center px-4 py-2 border border-gray-300 text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50">
                    Next
                </a>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const toggleUpdateBtn = document.getElementById('toggleUpdateBtn');
            const submitUpdateBtn = document.getElementById('submitUpdateBtn');
            const radCols = document.querySelectorAll('.radio-col');
            const radios = document.querySelectorAll('.customer-radio');

            const toggleDeleteBtn = document.getElementById('toggleDeleteBtn');
            const submitDeleteBtn = document.getElementById('submitDeleteBtn');
            const checkboxCols = document.querySelectorAll('.checkbox-col');
            const checkboxes = document.querySelectorAll('.customer-checkbox');
            const selectAllCb = document.getElementById('selectAllCb');

            if (toggleUpdateBtn) {
                toggleUpdateBtn.addEventListener('click', function () {
                    radCols.forEach(col => col.classList.toggle('hidden'));
                    submitUpdateBtn.classList.toggle('hidden');
                    toggleUpdateBtn.classList.toggle('bg-yellow-400');
                    toggleUpdateBtn.classList.toggle('bg-gray-200');

                    // Close Delete mode if open
                    if (!submitDeleteBtn.classList.contains('hidden')) {
                        toggleDeleteBtn.click();
                    }

                    radios.forEach(r => r.checked = false);
                    submitUpdateBtn.disabled = true;
                });
            }

            radios.forEach(r => {
                r.addEventListener('change', function () {
                    submitUpdateBtn.disabled = !document.querySelector('.customer-radio:checked');
                });
            });

            if (toggleDeleteBtn) {
                toggleDeleteBtn.addEventListener('click', function () {
                    checkboxCols.forEach(col => col.classList.toggle('hidden'));
                    submitDeleteBtn.classList.toggle('hidden');
                    toggleDeleteBtn.classList.toggle('bg-red-600');
                    toggleDeleteBtn.classList.toggle('bg-gray-200');

                    // Close Update mode if open
                    if (!submitUpdateBtn.classList.contains('hidden')) {
                        toggleUpdateBtn.click();
                    }

                    checkboxes.forEach(cb => cb.checked = false);
                    if (selectAllCb) selectAllCb.checked = false;
                    submitDeleteBtn.disabled = true;
                });
            }

            if (selectAllCb) {
                selectAllCb.addEventListener('change', function (e) {
                    checkboxes.forEach(cb => cb.checked = e.target.checked);
                    submitDeleteBtn.disabled = !document.querySelector('.customer-checkbox:checked');
                });
            }

            checkboxes.forEach(cb => {
                cb.addEventListener('change', function () {
                    submitDeleteBtn.disabled = !document.querySelector('.customer-checkbox:checked');
                    if (selectAllCb) {
                        selectAllCb.checked = document.querySelectorAll('.customer-checkbox:checked').length === checkboxes.length && checkboxes.length > 0;
                    }
                });
            });
        });
    </script>
</body>

</html>
