<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Management Form - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #141414; color: white; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .bg-netflix { background-color: #E50914; }
        .text-netflix { color: #E50914; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #b3b3b3; }
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen fade-in flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
        <div class="flex items-center gap-8">
            <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
            <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
                <a href="/" class="text-gray-300 nav-link">Home</a>
                <a href="/films" class="text-gray-300 nav-link">Films</a>
                <a href="/categories" class="text-gray-300 nav-link">Categories</a>
                <a href="/customers" class="text-gray-300 nav-link">Customers</a>
                <a href="/staff" class="text-white nav-link">Staff</a>
            </div>
        </div>
    </nav>

    <div class="max-w-3xl mx-auto p-4 sm:p-8 flex-grow w-full">

        <div class="bg-black shadow-lg rounded-xl border border-gray-800 overflow-hidden fade-in">
            <div class="px-6 py-5 bg-gray-900 border-b border-gray-800 flex items-center justify-between">
                <h3 class="text-xl font-bold text-white tracking-wide" th:text="${staff.staffId == null} ? 'Add New Staff Member' : 'Update Staff Member'">Staff Form</h3>
            </div>
            
            <div class="p-6 sm:p-8">
                <form th:action="@{/aditya/staff/save}" th:object="${staff}" method="post">
                    <input type="hidden" th:field="*{staffId}">

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">First Name <span class="text-netflix">*</span></label>
                            <input type="text" th:field="*{firstName}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none"
                                   placeholder="Enter first name" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Last Name <span class="text-netflix">*</span></label>
                            <input type="text" th:field="*{lastName}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none"
                                   placeholder="Enter last name" required>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Username <span class="text-netflix">*</span></label>
                            <input type="text" th:field="*{username}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none"
                                   placeholder="Choose a username" required>
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Email Address</label>
                            <input type="email" th:field="*{email}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none"
                                   placeholder="email@example.com">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Password <span class="text-netflix">*</span></label>
                            <input type="password"
                                   th:field="*{password}"
                                   class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none"
                                   th:required="${staff.staffId == null}"
                                   placeholder="Enter secure password">
                            
                            <p class="mt-2 text-xs text-gray-500" th:if="${staff.staffId != null}">
                                Leave blank to keep current password
                            </p>
                            <p class="mt-2 text-xs text-blue-400" th:if="${staff.staffId == null}">
                                Password is required for new accounts.
                            </p>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-gray-400 mb-2">Account Status <span class="text-netflix">*</span></label>
                            <select th:field="*{active}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none" required>
                                <option th:value="true">Active</option>
                                <option th:value="false">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <hr class="border-gray-800 my-8">

                    <div class="mb-6" th:if="${staff.staffId == null}">
                        <label class="block text-sm font-bold text-gray-400 mb-2">Assigned Store <span class="text-netflix">*</span></label>
                        <select th:field="*{store}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none" required>
                            <option value="">-- Select a Store --</option>
                            <option th:each="s : ${stores}"
                                    th:value="${s.storeId}"
                                    th:text="${'Store #' + s.storeId + ' - ' + s.getFullDisplay()}"></option>
                        </select>
                    </div>

                    <div class="mb-8" th:if="${staff.staffId == null}">
                        <label class="block text-sm font-bold text-gray-400 mb-2">Residential Address <span class="text-netflix">*</span></label>
                        <select th:field="*{address}" class="w-full px-4 py-2 border border-gray-700 bg-gray-800 text-white rounded-lg focus:ring-2 focus:ring-[#E50914] focus:outline-none" required>
                            <option value="">-- Select an Address --</option>
                            <option th:each="a : ${addresses}"
                                    th:value="${a.addressId}"
                                    th:text="${a.fullDisplay}"></option>
                        </select>
                    </div>

                    <div class="flex items-center justify-between pt-4">
                        <a th:href="@{/aditya/staff}" class="px-4 py-2 border border-gray-700 text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-800 transition">Back to List</a>
                        <button type="submit" class="px-6 py-2 bg-netflix text-white rounded-lg text-sm font-bold hover:bg-red-700 transition shadow-lg">Save Staff Information</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-600 border-t border-gray-900 mt-auto bg-black">
        <p class="text-xs">&copy; 2026 FilmFlix Management System.</p>
    </footer>

</body>
</html>
