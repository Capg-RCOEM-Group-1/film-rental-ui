<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Films</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen p-6">

<div class="max-w-7xl mx-auto">

    <!-- Header -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

        <div class="flex items-center gap-3">
            <h1 class="text-2xl font-bold text-gray-800">🎬 Films</h1>
        </div>

        <!-- Search -->
        <form th:action="@{/mandar/language/films}" method="GET"
              class="flex items-center gap-2 w-full sm:w-auto">

            <input type="hidden" name="id" th:value="${id}" />
            <input type="hidden" name="name" th:value="${name}">

            <div class="relative">
                <input type="text" name="title" th:value="${title}"
                       placeholder="Search films..."
                       class="w-64 pl-10 pr-3 py-2 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none shadow-sm text-sm">

                <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-400"
                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
            </div>

            <button type="submit"
                    class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm hover:bg-blue-700 transition shadow">
                Search
            </button>
        </form>
        <a href="/mandar/languages"
           class="text-gray-400 hover:text-red-500 text-xl transition">
            ✕
        </a>
    </div>

    <!-- Table Card -->
    <div class="bg-white rounded-2xl shadow-md overflow-hidden">

        <div class="overflow-x-auto">
            <table class="min-w-full text-sm">

                <!-- Header -->
                <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="px-6 py-3 text-left font-semibold text-gray-600">Title</th>
                    <th class="px-6 py-3 text-left font-semibold text-gray-600">Description</th>
                    <th class="px-6 py-3 text-left font-semibold text-gray-600">Year</th>
                    <th class="px-6 py-3 text-left font-semibold text-gray-600">Rating</th>
                    <th class="px-6 py-3 text-left font-semibold text-gray-600">Features</th>
                </tr>
                </thead>

                <!-- Body -->
                <tbody class="divide-y">

                <tr th:each="film : ${films}"
                    class="hover:bg-blue-50 transition duration-150">

                    <td class="px-6 py-4 font-medium text-gray-800"
                        th:text="${film.title}"></td>

                    <td class="px-6 py-4 text-gray-600 max-w-xs truncate"
                        th:text="${film.description}"></td>

                    <td class="px-6 py-4 text-gray-500"
                        th:text="${film.releaseYear}"></td>

                    <td class="px-6 py-4">
                        <span class="px-2 py-1 text-xs rounded-full bg-green-100 text-green-700"
                              th:text="${film.rating}"></span>
                    </td>

                    <td class="px-6 py-4 text-gray-500"
                        th:text="${film.specialFeatures}"></td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${films == null or films.isEmpty()}">
                    <td colspan="5" class="text-center py-10 text-gray-400">
                        🎬 No films found
                    </td>
                </tr>

                </tbody>
            </table>
        </div>
    </div>

    <!-- Pagination -->
    <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4"
         th:if="${pageData != null and pageData.totalPages > 0}">

        <!-- Info -->
        <p class="text-sm text-gray-600">
            Page <span class="font-semibold" th:text="${pageData.number + 1}"></span>
            of <span class="font-semibold" th:text="${pageData.totalPages}"></span>
            • Total <span class="font-semibold" th:text="${pageData.totalElements}"></span>
        </p>

        <!-- Buttons -->
        <div class="flex gap-2">

            <a th:if="${pageData.number > 0}"
               th:href="@{/mandar/language/films(page=${pageData.number - 1}, id=${id}, title=${title})}"
               class="px-4 py-2 rounded-xl bg-white border shadow-sm hover:bg-gray-100 transition">
                ⬅ Prev
            </a>

            <a th:if="${pageData.number < pageData.totalPages - 1}"
               th:href="@{/mandar/language/films(page=${pageData.number + 1}, id=${id}, title=${title})}"
               class="px-4 py-2 rounded-xl bg-blue-600 text-white shadow hover:bg-blue-700 transition">
                Next ➡
            </a>

        </div>
    </div>

</div>

</body>
</html>
