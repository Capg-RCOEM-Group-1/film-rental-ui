<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Films By Language - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        body { background-color: #141414; color: white; }
        .bg-netflix { background-color: #E50914; }
        .hover-bg-netflix:hover { background-color: #f40612; }
        .text-netflix { color: #E50914; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #b3b3b3; }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>

<body class="font-sans antialiased min-h-screen fade-in flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
        <div class="flex items-center gap-8">
            <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
            <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
                <a href="/" class="text-white nav-link">Home</a>
                <a href="/films" class="text-gray-300 nav-link">Films</a>
                <a href="/categories" class="text-gray-300 nav-link">Categories</a>
                <a href="/ekansh/customers" class="text-gray-300 nav-link">Customers</a>
                <a href="/aditya/staff" class="text-gray-300 nav-link">Staff</a>
                <a href="/mandar/languages" class="text-gray-300 nav-link">Languages</a>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-4 sm:p-8 flex-grow w-full">

        <!-- Header -->
        <div class="bg-black border border-gray-800 rounded-2xl shadow-lg p-6 mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">

            <div class="flex items-center gap-3">
                <h1 class="text-3xl font-extrabold text-white tracking-tight">
                    <span class="text-netflix">Films</span> for Language
                </h1>
            </div>

            <!-- Search -->
            <form th:action="@{/mandar/language/films}" method="GET" class="flex items-center gap-2 w-full sm:w-auto">
                <input type="hidden" name="id" th:value="${id}" />
                <input type="hidden" name="name" th:value="${name}">

                <div class="relative w-full sm:w-auto">
                    <input type="text" name="title" th:value="${title}"
                           placeholder="Search films..."
                           class="w-full sm:w-64 pl-10 pr-3 py-2 rounded-xl border border-gray-700 bg-gray-900 text-white placeholder-gray-500 focus:ring-2 focus:ring-[#E50914] focus:outline-none shadow-sm text-sm">

                    <svg class="w-4 h-4 absolute left-3 top-2.5 text-gray-500"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>

                <button type="submit" class="bg-gray-800 text-white border border-gray-700 px-4 py-2 rounded-xl text-sm font-medium hover:bg-gray-700 transition shadow">
                    Search
                </button>
            </form>
            
            <a href="/mandar/languages" class="text-gray-400 hover:text-white transition p-2 bg-gray-900 rounded-full hover:bg-gray-800">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </a>
        </div>

        <!-- Table Card -->
        <div class="bg-black border border-gray-800 rounded-2xl shadow-lg overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm divide-y divide-gray-800">

                    <!-- Header -->
                    <thead class="bg-gray-900 border-b border-gray-800">
                    <tr>
                        <th class="px-6 py-4 text-left font-bold text-gray-400 uppercase tracking-wider text-xs">Title</th>
                        <th class="px-6 py-4 text-left font-bold text-gray-400 uppercase tracking-wider text-xs">Description</th>
                        <th class="px-6 py-4 text-left font-bold text-gray-400 uppercase tracking-wider text-xs">Year</th>
                        <th class="px-6 py-4 text-left font-bold text-gray-400 uppercase tracking-wider text-xs">Rating</th>
                        <th class="px-6 py-4 text-left font-bold text-gray-400 uppercase tracking-wider text-xs">Features</th>
                    </tr>
                    </thead>

                    <!-- Body -->
                    <tbody class="divide-y divide-gray-800">

                    <tr th:each="film : ${films}" class="hover:bg-gray-900 transition duration-200 group">
                        <td class="px-6 py-4 font-bold text-white" th:text="${film.title}"></td>
                        <td class="px-6 py-4 text-gray-400 max-w-xs truncate" th:text="${film.description}"></td>
                        <td class="px-6 py-4 text-gray-500" th:text="${film.releaseYear}"></td>
                        <td class="px-6 py-4">
                            <span class="px-2.5 py-1 text-xs font-bold rounded border border-gray-700 bg-gray-800 text-gray-300" th:text="${film.rating}"></span>
                        </td>
                        <td class="px-6 py-4 text-gray-500 text-xs" th:text="${film.specialFeatures}"></td>
                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${films == null or films.isEmpty()}">
                        <td colspan="5" class="text-center py-12 text-gray-500">
                            No films found for this language.
                        </td>
                    </tr>

                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4"
             th:if="${pageData != null and pageData.totalPages > 0}">

            <!-- Info -->
            <p class="text-sm text-gray-400 p-2">
                Page <span class="font-bold text-white" th:text="${pageData.number + 1}"></span>
                of <span class="font-bold text-white" th:text="${pageData.totalPages}"></span>
                • Total <span class="font-bold text-white" th:text="${pageData.totalElements}"></span>
            </p>

            <!-- Buttons -->
            <div class="flex gap-2">
                <a th:if="${pageData.number > 0}"
                   th:href="@{/mandar/language/films(page=${pageData.number - 1}, id=${id}, title=${title})}"
                   class="px-4 py-2 border border-gray-700 rounded-lg text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    &larr; Prev
                </a>
                <a th:if="${pageData.number < pageData.totalPages - 1}"
                   th:href="@{/mandar/language/films(page=${pageData.number + 1}, id=${id}, title=${title})}"
                   class="px-4 py-2 border border-gray-700 rounded-lg text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    Next &rarr;
                </a>
            </div>
        </div>

    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-600 border-t border-gray-900 mt-auto bg-black">
        <p class="text-xs">&copy; 2026 FilmFlix Management System.</p>
    </footer>

</body>
</html>
