<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Update Customer</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 flex justify-center items-start pt-10">

<div class="max-w-2xl w-full bg-white shadow-md rounded-xl border border-gray-200 overflow-hidden">
  <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between">
    <h2 class="text-xl font-bold">Update Customer</h2>
    <a href="/ekansh/customers" class="text-gray-400 hover:text-gray-600">✕</a>
  </div>

  <form th:action="@{/ekansh/customers/edit}" th:object="${customerForm}" method="POST" class="p-6">
    <input type="hidden" th:field="*{customerId}">
    
    <div class="grid grid-cols-2 gap-6 mb-6">

      <div>
        <label class="block text-sm font-medium mb-1">First Name *</label>
        <input type="text" th:field="*{firstName}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Last Name *</label>
        <input type="text" th:field="*{lastName}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <div class="col-span-2">
        <label class="block text-sm font-medium mb-1">Email Address</label>
        <input type="email" th:field="*{email}" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Assigned Store *</label>
        <select th:field="*{storeId}" required class="w-full px-3 py-2 border rounded-lg bg-white">
          <option value="" disabled selected>Select a store...</option>
          <option th:each="store : ${stores}" th:value="${store.storeId}" th:text="${store.fullDisplay}"></option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Customer Address *</label>
        <select th:field="*{addressId}" required class="w-full px-3 py-2 border rounded-lg bg-white">
          <option value="" disabled selected>Select an address...</option>
          <option th:each="address : ${addresses}" th:value="${address.addressId}" th:text="${address.fullDisplay}"></option>
        </select>
      </div>
    </div>

    <div class="flex justify-end gap-3 pt-4 border-t">
      <a href="/ekansh/customers" class="px-4 py-2 border rounded-lg text-sm">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-yellow-500 text-white rounded-lg text-sm hover:bg-yellow-600">Update Customer</button>
    </div>
  </form>
</div>
</body>
</html>
