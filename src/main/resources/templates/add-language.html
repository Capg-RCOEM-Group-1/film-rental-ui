<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Customer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8 flex justify-center items-start pt-10">

<div class="max-w-2xl w-full bg-white shadow-md rounded-xl border border-gray-200 overflow-hidden">
    <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between">
        <h2 class="text-xl font-bold">Add New Language</h2>
        <a href="/mandar/languages" class="text-gray-400 hover:text-gray-600">✕</a>
    </div>

    <form th:action="@{/mandar/languages}" th:object="${languageForm}" method="POST" class="p-6">
        <div class="grid grid-cols-2 gap-6 mb-6">

            <div>
                <label class="block text-sm font-medium mb-1">Name</label>
                <input type="text" th:field="*{name}" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t">
            <a href="/mandar/languages" class="px-4 py-2 border rounded-lg text-sm">Cancel</a>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm hover:bg-blue-700">Save Customer</button>
        </div>
    </form>
</div>
</body>
</html>
