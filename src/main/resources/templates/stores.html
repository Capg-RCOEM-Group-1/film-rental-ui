<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>FilmFlix - Store Directory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      background-color: #141414;
      color: white;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .bg-netflix {
      background-color: #E50914;
    }

    .hover-bg-netflix:hover {
      background-color: #f40612;
    }

    .text-netflix {
      color: #E50914;
    }

    .nav-link {
      transition: color 0.2s;
    }

    .nav-link:hover {
      color: #b3b3b3;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #141414;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }
  </style>
</head>

<body class="font-sans antialiased min-h-screen fade-in flex flex-col bg-[#141414] text-white">

  <!-- Navbar -->
  <nav
    class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
    <div class="flex items-center gap-8">
      <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
      <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
        <a href="/" class="text-gray-300 nav-link">Home</a>
        <a href="/films" class="text-gray-300 nav-link">Films</a>
        <a href="/categories" class="text-gray-300 nav-link">Categories</a>
        <a href="/ekansh/customers" class="text-gray-300 nav-link">Customers</a>
        <a href="/aditya/staff" class="text-gray-300 nav-link">Staff</a>
        <a href="/mandar/languages" class="text-gray-300 nav-link">Languages</a>
        <a href="/ameya/stores" class="text-white nav-link">Stores</a>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-4 sm:p-8 flex-grow w-full">
    <div class="mb-8">
      <h2 class="text-3xl font-extrabold text-white tracking-tight text-netflix">Store Directory</h2>
      <p class="text-gray-400 mt-2 text-sm">Manage store locations and view their inventory catalogs.</p>
    </div>

    <!-- Alert Messages -->
    <div th:if="${successMessage}"
      class="bg-green-900 border-l-4 border-green-500 p-4 mb-6 rounded-r-lg text-green-200 fade-in">
      <p class="text-sm font-medium" th:text="${successMessage}"></p>
    </div>
    <div th:if="${error}" class="bg-red-900 border-l-4 border-netflix p-4 mb-6 rounded-r-lg text-red-200 fade-in">
      <p class="text-sm font-medium" th:text="${error}"></p>
    </div>

    <!-- Toolbar: Search + Buttons -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
      <form action="/ameya/stores" method="GET" class="flex flex-wrap w-full sm:w-auto gap-3">
        <input type="text" name="keyword" th:value="${currentKeyword}"
          class="block w-full sm:w-80 px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white placeholder-gray-400 focus:ring-2 focus:ring-[#E50914] focus:border-transparent sm:text-sm"
          placeholder="Search Metropolis or Address...">
        <button type="submit"
          class="px-4 py-2 border border-gray-700 text-white rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 transition">Search</button>
        <a th:if="${currentKeyword != null and !currentKeyword.isEmpty()}" href="/ameya/stores"
          class="px-4 py-2 border border-gray-700 text-white rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 transition">Clear</a>
      </form>

      <div class="flex gap-3">
        <a href="/ameya/stores/add"
          class="px-4 py-2 bg-white text-black bg-opacity-90 rounded-lg text-sm font-bold hover:bg-gray-200 transition flex items-center gap-1">+
          Register Store</a>
        <button type="button" id="toggleUpdateBtn"
          class="px-4 py-2 border border-gray-700 text-white rounded-lg text-sm font-medium bg-gray-800 hover:bg-gray-700 transition flex items-center">Update
          Mode</button>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-black shadow-lg rounded-xl border border-gray-800 overflow-hidden">
      <table class="min-w-full divide-y divide-gray-800 text-left text-sm">
        <thead class="bg-gray-900">
          <tr>
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Sr.No</th>
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Store Location</th>
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider">Metropolis</th>
            <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-wider text-right">Inventory</th>
          </tr>
        </thead>
        <tbody class="bg-black divide-y divide-gray-800">
          <tr th:each="store : ${stores}" class="hover:bg-gray-900 transition group">
            <td class="px-6 py-4 font-mono font-bold text-netflix" th:text="${store.storeId}"></td>
            <td class="px-6 py-4 font-bold text-white">
              <span class="store-address-text" th:text="${store.address}"></span>
              <div class="store-address-form hidden">
                <form action="/ameya/stores/editAddress" method="POST" class="flex items-center gap-2">
                  <input type="hidden" name="storeId" th:value="${store.storeId}">
                  <!-- Re-styled the dropdown for dark mode! -->
                  <select name="addressId"
                    class="bg-gray-800 border border-gray-600 text-white text-xs rounded-lg p-2 w-48 focus:ring-2 focus:ring-netflix outline-none">
                    <option th:each="addr : ${addresses}" th:value="${addr.addressId}"
                      th:text="${addr.address + ', ' + addr.district}" th:selected="${addr.address == store.address}">
                    </option>
                  </select>
                  <!-- Using our stylish yellow button for updates -->
                  <button type="submit"
                    class="bg-yellow-500 hover:bg-yellow-600 text-black px-3 py-2 rounded-lg font-bold text-xs transition">Save</button>
                </form>
              </div>
            </td>
            <td class="px-6 py-4 text-gray-400 font-medium uppercase tracking-wider" th:text="${store.city}"></td>
            <td class="px-6 py-4 text-right">
              <a th:href="@{/ameya/inventory(storeId=${store.storeId})}"
                class="inline-flex items-center px-4 py-2 border border-gray-700 text-gray-300 rounded text-xs font-bold hover:bg-white hover:text-black transition">Catalog</a>
            </td>
          </tr>
          <tr th:if="${stores == null or stores.isEmpty()}">
            <td colspan="4" class="px-6 py-12 text-center text-gray-500">No stores found matching your criteria.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Footer -->
  <footer class="py-8 text-center text-gray-500 border-t border-gray-800 mt-auto bg-black bg-opacity-80">
    <p>&copy; 2026 FilmFlix Management System</p>
  </footer>

  <script>
    document.getElementById('toggleUpdateBtn').addEventListener('click', function () {
      document.querySelectorAll('.store-address-text').forEach(c => c.classList.toggle('hidden'));
      document.querySelectorAll('.store-address-form').forEach(c => c.classList.toggle('hidden'));
      this.innerText = this.innerText === 'Update Mode' ? 'Exit Mode' : 'Update Mode';
    });
  </script>
</body>

</html>
