<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Store Dashboard | FilmRental</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-blue-50 min-h-screen p-4 md:p-10">
<div class="max-w-6xl mx-auto">
  <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-4">
    <div>
      <h1 class="text-4xl font-black text-slate-800 tracking-tight">Store <span class="text-blue-600">Network</span></h1>
      <p class="text-slate-500 mt-1">Real-time inventory and location management</p>
    </div>
    <button class="bg-slate-900 hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-2xl transition-all shadow-lg hover:shadow-blue-200 flex items-center gap-2">
      <span>+</span> Add New Location
    </button>
  </div>

  <div class="glass border border-white shadow-2xl rounded-[2rem] overflow-hidden">
    <table class="min-w-full">
      <thead>
      <tr class="bg-slate-900/5 border-b border-slate-200">
        <th class="px-8 py-5 text-left text-xs font-bold text-slate-400 uppercase tracking-widest">ID</th>
        <th class="px-8 py-5 text-left text-xs font-bold text-slate-400 uppercase tracking-widest">Location Details</th>
        <th class="px-8 py-5 text-left text-xs font-bold text-slate-400 uppercase tracking-widest">Last Sync</th>
        <th class="px-8 py-5 text-right text-xs font-bold text-slate-400 uppercase tracking-widest">Actions</th>
      </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
      <tr th:each="store : ${stores}" class="group hover:bg-white/80 transition-all cursor-default">
        <td class="px-8 py-6">
          <span class="bg-slate-100 text-slate-600 font-mono font-bold px-3 py-1 rounded-lg text-sm" th:text="${store.storeId}"></span>
        </td>
        <td class="px-8 py-6">
          <div class="text-slate-900 font-bold" th:text="${store.address}">Address</div>
          <div class="text-slate-400 text-sm flex items-center gap-1">
            📍 <span th:text="${store.city}">City</span>
          </div>
        </td>
        <td class="px-8 py-6 text-slate-500 text-sm" th:text="${#dates.format(store.lastUpdate, 'dd MMM yyyy')}"></td>
        <td class="px-8 py-6 text-right">
          <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
            <a th:href="@{/stores/{id}/inventory(id=${store.storeId})}"
               class="bg-blue-50 text-blue-600 px-4 py-2 rounded-xl text-sm font-bold hover:bg-blue-600 hover:text-white transition shadow-sm">
              Inventory
            </a>
            <a href="#" class="bg-slate-50 text-slate-600 p-2 rounded-xl hover:bg-amber-100 hover:text-amber-700 transition">
              ⚙️
            </a>
            <form th:action="@{/stores/delete/{id}(id=${store.storeId})}" method="POST" class="inline">
              <button type="submit" class="bg-slate-50 text-slate-600 p-2 rounded-xl hover:bg-red-100 hover:text-red-700 transition">
                🗑️
              </button>
            </form>
          </div>
        </td>
      </tr>
      </tbody>
    </table>

    <div th:if="${stores == null or stores.isEmpty()}" class="py-20 text-center">
      <div class="text-6xl mb-4">🏪</div>
      <h3 class="text-xl font-bold text-slate-800">No Stores Linked</h3>
      <p class="text-slate-500">Your network is currently empty.</p>
    </div>
  </div>
</div>
</body>
</html>
