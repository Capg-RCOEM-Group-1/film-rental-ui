<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Category Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --shadow-soft: 0 10px 40px rgba(0,0,0,0.08);
            --shadow-hover: 0 20px 60px rgba(0,0,0,0.12);
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .page-header {
            color: white;
            text-align: center;
            padding: 40px 0 30px;
        }

        .page-header h2 {
            font-weight: 700;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }

        .page-header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: var(--shadow-soft);
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .search-box {
            display: flex;
            gap: 12px;
        }

        .search-box input {
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 12px 20px;
            width: 300px;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn-custom {
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-search {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            color: white;
        }

        .btn-clear {
            background: #f8f9fa;
            color: #6c757d;
            border: 2px solid #e0e0e0;
        }

        .btn-clear:hover {
            background: #e9ecef;
            color: #495057;
        }

        .btn-add {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            font-weight: 600;
        }

        .btn-add:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(17, 153, 142, 0.4);
            color: white;
        }

        .table-container {
            padding: 0;
        }

        .custom-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .custom-table th {
            padding: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .custom-table th:first-child {
            border-radius: 0 0 0 0;
        }

        .custom-table td {
            padding: 20px;
            vertical-align: middle;
            border-bottom: 1px solid #f0f0f0;
        }

        .custom-table tbody tr {
            transition: all 0.3s ease;
        }

        .custom-table tbody tr:hover {
            background: #f8f9ff;
            transform: scale(1.01);
        }

        .id-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .category-name {
            font-weight: 600;
            color: #2d3748;
            font-size: 1.05rem;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-action {
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-view {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 172, 254, 0.4);
            color: white;
        }

        .btn-edit {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(250, 112, 154, 0.4);
            color: white;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
        }

        .btn-delete:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.4);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state i {
            font-size: 4rem;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        .empty-state p {
            color: #999;
            font-size: 1.1rem;
        }

        .pagination-container {
            padding: 25px;
            display: flex;
            justify-content: center;
        }

        .pagination {
            gap: 8px;
        }

        .page-link {
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 500;
            color: #667eea;
            background: #f8f9fa;
            transition: all 0.3s ease;
        }

        .page-link:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .page-item.active .page-link {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .page-item.disabled .page-link {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Header -->
    <div class="page-header">
        <h2><i class="fas fa-film"></i> Category Management</h2>
        <p>Manage your film categories with ease</p>
    </div>

    <!-- Glass Card -->
    <div class="glass-card">

        <!-- Toolbar -->
        <div class="toolbar">
            <form th:action="@{/categories}" method="get" class="search-box">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search categories...">
                <button class="btn-custom btn-search"><i class="fas fa-search"></i> Search</button>
                <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/categories}" class="btn-custom btn-clear"><i class="fas fa-times"></i> Clear</a>
            </form>
            <a th:href="@{/categories/add}" class="btn-custom btn-add"><i class="fas fa-plus"></i> Add Category</a>
        </div>

        <!-- Table -->
        <div class="table-container">
            <table class="custom-table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Category Name</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td><span class="id-badge" th:text="${category.categoryId}"></span></td>
                    <td class="category-name" th:text="${category.name}"></td>
                    <td>
                        <div class="action-btns">
                            <a class="btn-action btn-view" th:href="@{/categories/films(categoryId=${category.categoryId}, name=${category.name})}">
                                <i class="fas fa-eye"></i> View Films
                            </a>
                            <a class="btn-action btn-edit" th:href="@{/categories/edit(id=${category.categoryId}, name=${category.name})}">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                            <a class="btn-action btn-delete" th:href="@{/categories/delete(id=${category.categoryId})}" onclick="return confirm('Are you sure you want to delete this category?');">
                                <i class="fas fa-trash"></i> Delete
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="3">
                        <div class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>No categories found</p>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination-container" th:if="${page != null && page.totalPages > 1}">
            <nav>
                <ul class="pagination">
                    <li class="page-item" th:classappend="${page.number == 0} ? 'disabled' : ''">
                        <a class="page-link" th:href="@{/categories(page=${page.number - 1}, keyword=${keyword})}">
                            <i class="fas fa-chevron-left"></i> Previous
                        </a>
                    </li>
                    <li class="page-item active">
                        <span class="page-link" th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
                    </li>
                    <li class="page-item" th:classappend="${page.number + 1 >= page.totalPages} ? 'disabled' : ''">
                        <a class="page-link" th:href="@{/categories(page=${page.number + 1}, keyword=${keyword})}">
                            Next <i class="fas fa-chevron-right"></i>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

    </div>

</div>

</body>
</html>
