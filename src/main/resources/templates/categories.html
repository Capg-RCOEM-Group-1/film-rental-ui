<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Category Management - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        body { background-color: #141414; color: white; }
        .bg-netflix { background-color: #E50914; }
        .hover-bg-netflix:hover { background-color: #f40612; }
        .text-netflix { color: #E50914; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #b3b3b3; }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>

<body class="font-sans antialiased min-h-screen fade-in flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
        <div class="flex items-center gap-8">
            <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
            <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
                <a href="/" class="text-white nav-link">Home</a>
                <a href="/films" class="text-gray-300 nav-link">Films</a>
                <a href="/categories" class="text-gray-300 nav-link">Categories</a>
                <a href="/ekansh/customers" class="text-gray-300 nav-link">Customers</a>
                <a href="/aditya/staff" class="text-gray-300 nav-link">Staff</a>
                <a href="/mandar/languages" class="text-gray-300 nav-link">Languages</a>
            </div>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-4 sm:p-8 flex-grow w-full">

        <!-- Header -->
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-extrabold text-white tracking-tight text-netflix">🎬 Category Management</h2>
            <p class="text-gray-400 mt-2 text-sm">Organize the catalog by genres and sections.</p>
        </div>

        <!-- Toolbar -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
            <!-- Search -->
            <form th:action="@{/categories}" method="get" class="flex w-full md:w-auto gap-2">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="Search category..." 
                    class="w-full md:w-64 px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white placeholder-gray-400 focus:ring-2 focus:ring-[#E50914] focus:border-transparent text-sm" />
                <button type="submit" class="px-4 py-2 bg-gray-800 border border-gray-700 text-white rounded-lg text-sm font-medium hover:bg-gray-700 transition">Search</button>
                <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/categories}" class="px-4 py-2 border border-gray-700 rounded-lg text-sm bg-gray-800 hover:bg-gray-700 transition flex items-center">Clear</a>
            </form>

            <!-- Add button -->
            <a th:href="@{/categories/add}" class="px-4 py-2 bg-white text-black bg-opacity-90 rounded-lg text-sm font-bold hover:bg-gray-200 transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                Add Category
            </a>
        </div>

        <!-- Table Card -->
        <div class="bg-black shadow-lg rounded-xl border border-gray-800 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-800">
                    <thead class="bg-gray-900 text-xs font-bold text-gray-400 uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-4 text-left w-20">ID</th>
                            <th class="px-6 py-4 text-left">Category Name</th>
                            <th class="px-6 py-4 text-center">Actions</th>
                        </tr>
                    </thead>
                    <tbody class="bg-black divide-y divide-gray-800">

                        <!-- Categories -->
                        <tr th:each="category : ${categories}" class="hover:bg-gray-900 transition duration-200 group text-sm">
                            <td class="px-6 py-4 font-semibold text-gray-500" th:text="${category.categoryId}"></td>
                            <td class="px-6 py-4 font-bold text-white uppercase tracking-wider" th:text="${category.name}"></td>

                            <td class="px-6 py-4 text-center flex justify-center gap-2">
                                <!-- View Films -->
                                <a th:href="@{/categories/films(categoryId=${category.categoryId}, name=${category.name})}"
                                   class="px-3 py-1 bg-gray-800 text-white rounded text-xs hover:bg-gray-700 transition border border-gray-700">
                                    View Films
                                </a>

                                <!-- Edit -->
                                <a th:href="@{/categories/edit(id=${category.categoryId}, name=${category.name})}"
                                   class="px-3 py-1 bg-yellow-600/20 text-yellow-500 rounded text-xs hover:bg-yellow-600/30 transition border border-yellow-700/50">
                                    Edit
                                </a>

                                <!-- Delete -->
                                <a th:href="@{/categories/delete(id=${category.categoryId})}"
                                   onclick="return confirm('Are you sure you want to delete this category?');"
                                   class="px-3 py-1 bg-netflix text-white rounded text-xs hover:bg-red-700 transition">
                                    Delete
                                </a>
                            </td>
                        </tr>

                        <!-- Empty State -->
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="px-6 py-8 text-center text-gray-500">
                                No categories found. Adjust search or add a new one.
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-6 flex justify-center" th:if="${page != null && page.totalPages > 1}">
            <nav class="flex gap-2">
                <a th:if="${page.number > 0}"
                   th:href="@{/categories(page=${page.number - 1}, keyword=${keyword})}"
                   class="px-3 py-1 border border-gray-700 rounded text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    &larr; Prev
                </a>
                
                <span class="px-3 py-1 text-sm font-bold text-white bg-gray-800 rounded border border-gray-700"
                      th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>

                <a th:if="${page.number + 1 < page.totalPages}"
                   th:href="@{/categories(page=${page.number + 1}, keyword=${keyword})}"
                   class="px-3 py-1 border border-gray-700 rounded text-sm font-medium bg-black text-white hover:bg-gray-800 transition">
                    Next &rarr;
                </a>
            </nav>
        </div>

    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-gray-600 border-t border-gray-900 mt-auto bg-black">
        <p class="text-xs">&copy; 2026 FilmFlix Management System.</p>
    </footer>

</body>
</html>
