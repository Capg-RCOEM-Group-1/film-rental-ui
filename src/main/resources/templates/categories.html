<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Category Management</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Title -->
    <h2 class="text-center mb-4">🎬 Category Management</h2>

    <div class="d-flex justify-content-between mb-3 align-items-center">

        <!-- Search -->
        <form th:action="@{/categories}" method="get" class="d-flex">
            <input type="text" name="keyword" class="form-control me-2"
                   th:value="${keyword}" placeholder="Search category..." />
            <button class="btn btn-outline-primary">Search</button>
            <a th:if="${keyword != null && !keyword.isEmpty()}" th:href="@{/categories}" class="btn btn-outline-secondary ms-2">Clear</a>
        </form>

        <!-- Add button -->
        <a th:href="@{/categories/add}" class="btn btn-success">+ Add Category</a>

    </div>

    <!-- Table Card -->
    <div class="card shadow">
        <div class="card-body">

            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Category Name</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>

                <tbody>

                <!-- Categories -->
                <tr th:each="category : ${categories}">
                    <td th:text="${category.categoryId}"></td>
                    <td th:text="${category.name}"></td>

                    <td class="text-center">

                        <!-- View Films -->
                        <a class="btn btn-primary btn-sm me-1"
                           th:href="@{/categories/films(categoryId=${category.categoryId}, name=${category.name})}">
                            View Films
                        </a>

                        <!-- Edit -->
                        <a class="btn btn-warning btn-sm me-1"
                           th:href="@{/categories/edit(id=${category.categoryId}, name=${category.name})}">
                            Edit
                        </a>

                        <!-- Delete -->
                        <a class="btn btn-danger btn-sm"
                           th:href="@{/categories/delete(id=${category.categoryId})}"
                           onclick="return confirm('Are you sure you want to delete this category?');">
                            Delete
                        </a>

                    </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(categories)}">
                    <td colspan="3" class="text-center text-danger">
                        No categories found
                    </td>
                </tr>

                </tbody>
            </table>

        </div>
    </div>

    <!-- Pagination -->
    <div class="d-flex justify-content-center mt-4" th:if="${page != null && page.totalPages > 1}">

        <nav>
            <ul class="pagination">

                <li class="page-item" th:classappend="${page.number == 0} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/categories(page=${page.number - 1}, keyword=${keyword})}">
                        Previous
                    </a>
                </li>

                <li class="page-item active">
                <span class="page-link"
                      th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>
                </li>

                <li class="page-item" th:classappend="${page.number + 1 >= page.totalPages} ? 'disabled' : ''">
                    <a class="page-link"
                       th:href="@{/categories(page=${page.number + 1}, keyword=${keyword})}">
                        Next
                    </a>
                </li>

            </ul>
        </nav>

    </div>

</div>

</body>
</html>
