<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Film Cast - FilmFlix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(5px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        body { background-color: #141414; color: white; }
        .bg-netflix { background-color: #E50914; }
        .hover-bg-netflix:hover { background-color: #f40612; }
        .text-netflix { color: #E50914; }
        .nav-link { transition: color 0.2s; }
        .nav-link:hover { color: #b3b3b3; }
        
        /* Custom scrollbar for dark theme */
        ::-webkit-scrollbar { width: 10px; height: 10px; }
        ::-webkit-scrollbar-track { background: #141414; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 5px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
    </style>
</head>

<body class="font-sans antialiased min-h-screen fade-in flex flex-col">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-4 md:px-12 py-4 bg-black w-full z-10 sticky top-0 border-b border-gray-800">
        <div class="flex items-center gap-8">
            <a href="/" class="text-3xl font-bold text-netflix tracking-tighter">FILM<span class="text-white">FLIX</span></a>
            <div class="hidden md:flex gap-6 mt-1 text-sm font-semibold">
                <a href="/" class="text-white nav-link">Home</a>
                <a href="/films" class="text-gray-300 nav-link">Films</a>
                <a href="/categories" class="text-gray-300 nav-link">Categories</a>
                <a href="/ekansh/customers" class="text-gray-300 nav-link">Customers</a>
                <a href="/aditya/staff" class="text-gray-300 nav-link">Staff</a>
                <a href="/mandar/languages" class="text-gray-300 nav-link">Languages</a>
            </div>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto p-4 sm:p-8 flex-grow w-full">

        <!-- Back Button -->
        <a th:href="@{/films}" class="inline-flex items-center text-sm font-bold text-gray-400 hover:text-white mb-6 transition gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            Back to Film Catalog
        </a>

        <!-- Header -->
        <div class="bg-gray-900 rounded-t-xl border-t border-x border-gray-800 p-6 sm:p-8 flex flex-col items-center text-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight mb-2">Film Cast</h1>
            <p class="text-gray-400 text-sm">
                Cast list for: <span class="text-netflix font-bold uppercase text-lg ml-1" th:text="${filmTitle}"></span>
            </p>
        </div>

        <!-- Actors Table -->
        <div class="bg-black shadow-2xl rounded-b-xl border border-gray-800 overflow-hidden">
            <table class="min-w-full divide-y divide-gray-800">
                <thead class="bg-gray-900 border-b border-gray-800">
                    <tr>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-24">Sr No</th>
                        <th class="px-6 py-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Actor Name</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-800">
                    <tr th:each="actor, stat : ${actors}" class="hover:bg-gray-900 transition duration-200 group">
                        
                        <!-- Serial Number -->
                        <td class="px-6 py-5 whitespace-nowrap text-sm font-bold text-gray-500" th:text="${stat.count}"></td>
                        
                        <td class="px-6 py-5 whitespace-nowrap">
                            <div class="flex items-center">
                                <!-- Avatar Circle -->
                                <div class="h-10 w-10 border border-gray-700 rounded-full bg-gray-800 text-gray-300 flex items-center justify-center font-bold text-sm mr-4 shadow-sm group-hover:bg-gray-700 transition">
                                    <span th:if="${actor.firstName != null}" th:text="${#strings.substring(actor.firstName, 0, 1)}"></span>
                                    <span th:unless="${actor.firstName != null}">?</span>
                                </div>
                                
                                <!-- Full Name Display -->
                                <div class="text-sm font-bold text-white uppercase tracking-wide">
                                    <span th:text="${actor.firstName}"></span> 
                                    <span th:text="${actor.lastName}"></span>
                                </div>
                            </div>
                        </td>
                    </tr>

                    <!-- Empty State -->
                    <tr th:if="${#lists.isEmpty(actors)}">
                        <td colspan="2" class="px-6 py-12 text-center text-gray-500">
                            No cast information found for this film.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Footer -->
        <div class="mt-4 text-center">
            <p class="text-xs text-gray-500 font-medium">Total Actors Found: <span class="text-gray-300 ml-1" th:text="${#lists.size(actors)}"></span></p>
        </div>

    </div>
    
    <!-- App Footer -->
    <footer class="py-6 text-center text-gray-600 border-t border-gray-900 mt-auto bg-black">
        <p class="text-xs">&copy; 2026 FilmFlix Management System.</p>
    </footer>

</body>
</html>
