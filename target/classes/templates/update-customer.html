<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Cine Rentals | Relocate</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-image: url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=2070&auto=format&fit=crop'); background-size: cover; background-attachment: fixed; }
    .blur-layer { backdrop-filter: blur(8px); background: rgba(15, 23, 42, 0.7); min-height: 100vh; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased">
<div class="blur-layer flex items-center justify-center p-6">
  <div class="glass-card max-w-xl w-full p-12 rounded-[3rem] shadow-2xl border border-white/20">
    <div class="mb-10 text-center">
      <h2 class="text-3xl font-black text-slate-900 uppercase italic tracking-tighter">Relocate Store <span class="text-rose-600">#<span th:text="${storeId}"></span></span></h2>
      <p class="text-slate-500 mt-2 font-bold text-[10px] uppercase tracking-widest">Select a new operating address for this branch</p>
    </div>

    <form th:action="@{/ameya/stores/update-address}" method="POST" class="space-y-8">
      <input type="hidden" name="storeId" th:value="${storeId}">
      <div>
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] mb-3 ml-2">Available Locations</label>
        <select name="addressId" class="w-full bg-slate-50 border border-slate-200 text-slate-900 p-5 rounded-3xl outline-none focus:ring-2 focus:ring-rose-500 font-bold appearance-none" required>
          <option value="" disabled selected>Pick a new address...</option>
          <option th:each="addr : ${addresses}" th:value="${addr.addressId}" th:text="${addr.address}"></option>
        </select>
      </div>
      <div class="flex flex-col gap-4 pt-4">
        <button type="submit" class="w-full bg-rose-600 text-white py-4 rounded-2xl font-black uppercase text-xs tracking-widest hover:bg-rose-700 transition shadow-lg">Confirm Relocation</button>
        <a href="/ameya/stores" class="text-center text-slate-400 hover:text-slate-900 font-bold text-[10px] transition uppercase tracking-widest">Back</a>
      </div>
    </form>
  </div>
</div>
</body>
</html>
